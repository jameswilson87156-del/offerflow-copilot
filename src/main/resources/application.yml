spring:
  application:
    name: offerflow-copilot
  datasource:
    url: jdbc:h2:mem:offerflow;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

offerflow:
  persistence:
    seed-demo-data: true
  ai:
    provider:
      mode: ${OFFERFLOW_AI_PROVIDER_MODE:local-rule}
      real-call-enabled: ${OFFERFLOW_AI_REAL_CALL_ENABLED:false}
      raw-response-save: ${OFFERFLOW_AI_RAW_RESPONSE_SAVE:false}
      timeout-ms: ${OFFERFLOW_AI_TIMEOUT_MS:${OFFERFLOW_AI_PROVIDER_TIMEOUT_MS:8000}}
    openai-compatible:
      base-url: ${OFFERFLOW_OPENAI_COMPATIBLE_BASE_URL:}
      api-key: ${OFFERFLOW_OPENAI_COMPATIBLE_API_KEY:}
      model: ${OFFERFLOW_OPENAI_COMPATIBLE_MODEL:}
    deepseek:
      base-url: ${OFFERFLOW_DEEPSEEK_BASE_URL:}
      api-key: ${OFFERFLOW_DEEPSEEK_API_KEY:}
      model: ${OFFERFLOW_DEEPSEEK_MODEL:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 8080
